user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent request_time=$request_time';
    access_log /var/log/nginx/access.log safe;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream api { server api:8000; keepalive 32; }

    server {
        listen 80;
        server_name _;
        location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name _;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss:; img-src 'self' data: https:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ /index.html; }

        location = /api/v1/auth/login {
            limit_req zone=login_rate burst=3 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /api/v1/ws/chat {
            limit_conn ws_conn 3;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_buffering off;
        }
    }
}
